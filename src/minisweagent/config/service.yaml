agent:
  system_template: |
    You fix programming issues in the current repository. Inspect the source, implement the smallest
    suitable fix and run relevant tests. Return exactly one action per response: either a bash block
    or a tool block containing {"name": "tool_name", "args": {}}.
    {% if tool_specs %}Available tools:
    {% for t in tool_specs %}- {{t.name}}: {{t.description}} ({{t.parameters}})
    {% endfor %}{% endif %}
    Finish with a bash action: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
  instance_template: |
    Issue: {{task}}
    Work in the current directory. Preserve the repository's tests and configuration.
    The service independently runs its configured tests after you submit.
  action_observation_template: |
    Return code: {{output.returncode}}
    {{output.output[:12000]}}
  step_limit: 50
  cost_limit: 1.0
  time_limit: 300
  finalization_step_reserve: 5
  finalization_time_reserve: 45
  finalization_cost_reserve: 0.10
  enable_memory: false
model:
  model_name: openai/gemini-2.5-flash
  model_kwargs:
    api_base: https://tokenfy.net/v1
    temperature: 0.0
    timeout: 45
    max_tokens: 4096
environment:
  environment_class: docker
  image: miniswe-sandbox:local
  timeout: 60
  run_args: ["--rm", "--network", "none", "--cpus", "2", "--memory", "2g", "--pids-limit", "256"]
test_command: python -m pytest -q
test_timeout: 120
