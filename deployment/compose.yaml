services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.service
    image: miniswe-agent-service:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MSWEA_SERVICE_DATA_DIR: /agent-data
      MSWEA_SERVICE_REPO_ROOT: /repos
      MSWEA_SERVICE_WORKSPACE_VOLUME: cs427-agent-data
      MSWEA_SERVICE_TOKEN: ${MSWEA_SERVICE_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - agent-data:/agent-data
      - type: bind
        source: ${MSWEA_SERVICE_REPO_ROOT:?Set a repository parent directory on the desktop}
        target: /repos
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
  sandbox:
    profiles: ["build"]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.sandbox
    image: miniswe-sandbox:local
volumes:
  agent-data:
    name: cs427-agent-data
